name: Check channels

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:
  issues:
    types: [opened]            # someone reported a broken channel from the app

permissions:
  contents: write
  issues: write

jobs:
  check:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Broken:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test every channel link and fix what can be fixed
        run: python tools/check_channels.py

      - name: Save playlist changes
        run: |
          git config user.name "satv-bot"
          git config user.email "satv-bot@users.noreply.github.com"
          git add playlist
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update playlist [skip ci]"
            git push
          fi

      - name: Reply to the report
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file report.md
          gh issue close "$NUMBER"
